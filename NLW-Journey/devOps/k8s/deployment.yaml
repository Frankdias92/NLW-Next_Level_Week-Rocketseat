apiVersion: apps/v1
kind: Deployment

metadata:
  name: jouney-deployment
  labels:
    app: journey

spec:
  replicas: 5
  selector:
    matchLabels:
      app: journey
  template:
    spec:
      containers:
        - name: api-journey
          image: frankmd/dev-ops-nlw:d0eb6c8
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 256Mi